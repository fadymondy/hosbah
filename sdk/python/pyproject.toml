[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hosbah-sdk"
version = "0.1.0"
description = "Hosbah SDK for Python — manage servers, apps, domains and proxy hosts from your app."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

authors = [{ name = "Fady Mondy" }]

[project.urls]
Homepage = "https://hosbah.com"
Source = "https://github.com/fadymondy/hosbah-python"
Issues = "https://github.com/fadymondy/hosbah-python/issues"

[tool.setuptools]
packages = ["hosbah"]
