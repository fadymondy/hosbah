# Hosbah control plane on a single container host. Images are built elsewhere and loaded via
# `docker load`. A reverse proxy in front forwards the public host (e.g. app.hosbah.com) ->
# <host>:3710 (web). web proxies /api -> api. Managed servers connect out to
# wss://<public host>/agent/ws (same pinned key via HOSBAH_KEK).
#
# Before the rename this stack was the project cloudy-prod (containers cloudy-api, cloudy-web, images
# cloudy-api, cloudy-web). To switch a running box to these names, tag the images as hosbah-api and
# hosbah-web, then `docker compose -p cloudy-prod down && docker compose up -d` (a few seconds of
# downtime; there are no volumes: all state is in Postgres). Keep the same .env.prod.
name: hosbah-prod
services:
  api:
    image: hosbah-api
    container_name: hosbah-api
    env_file: .env.prod
    ports:
      - "0.0.0.0:8710:8710"
    restart: unless-stopped
  web:
    image: hosbah-web
    container_name: hosbah-web
    environment:
      NODE_ENV: production
      API_ORIGIN: http://api:8710
    ports:
      - "0.0.0.0:3710:3710"
    depends_on:
      - api
    restart: unless-stopped
