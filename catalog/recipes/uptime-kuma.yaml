# Written from Uptime Kuma's own documentation (github.com/louislam/uptime-kuma wiki: "How to Install",
# "Reverse Proxy", data directory /app/data) and the louislam/uptime-kuma image. There is no env-based
# admin account: the first visit to the hostname creates it.
# verified: false — written from the documentation but not yet run end to end by Hosbah.
id: uptime-kuma
name: Uptime Kuma
summary: A self-hosted status and uptime monitor with a dashboard, notifications and status pages.
description: >-
  Uptime Kuma watches HTTP(S), TCP, ping and DNS targets and shows their history on a dashboard, with
  notifications (email, Slack, Discord and more, configured in its own settings) and public status
  pages. Hosbah runs the official image and keeps its SQLite database on a volume. There is no
  environment-variable account: create the admin user on first visit to the hostname. Nothing else on
  Hosbah reads its data.
homepage: https://uptime.kuma.pet
licence: MIT
kind: app
version: "1.0.0"
verified: false
image: louislam/uptime-kuma:1.23.16
port: 3001
healthcheck: /
volumes:
  - name: data
    mount_path: /app/data
limits:
  memory_mb: 256
  cpus: 0.5
exposes:
  - env: UPTIME_KUMA_URL
    template: "https://{host}"
