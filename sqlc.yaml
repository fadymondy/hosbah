version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/db/schema"
    queries: "internal/db/queries"
    gen:
      go:
        package: "db"
        out: "internal/db/gen"
        emit_json_tags: true
        emit_db_tags: true
        emit_pointers_for_null_types: true
        # togo's generated resources/*.go use Go initialisms (PageURL); sqlc's default is PageUrl.
        rename:
          page_url: PageURL
          external_url: ExternalURL
        # togo 0.2.31 writes emit_pointers_for_null_types, which sqlc honours only with
        # sql_package pgx/v5. With the postgresql engine on database/sql, nullable
        # columns came out as sql.NullString/NullTime and the generated resources/*.go
        # (which expect pointers) did not compile. These overrides make them pointers.
        overrides:
          - db_type: "timestamptz"
            nullable: true
            go_type: { import: "time", type: "Time", pointer: true }
          - db_type: "text"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "jsonb"
            nullable: true
            go_type: { type: "string", pointer: true }
          - db_type: "jsonb"
            go_type: "string"
          - db_type: "bigint"
            nullable: true
            go_type: { type: "int64", pointer: true }
          # sqlc resolves a nullable bigint COLUMN as pg_catalog.int8, which the "bigint" entry above
          # does not match (operations.exit_code came out as sql.NullInt64 and the generated
          # resources/operation.go, which expects *int64, did not compile).
          - db_type: "pg_catalog.int8"
            nullable: true
            go_type: { type: "int64", pointer: true }
