<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1429" />
    <title>Offline · Hosbah</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      :root { color-scheme: dark light; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
        background: #0b1429; color: #f0ebe1;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Arabic", sans-serif;
      }
      @media (prefers-color-scheme: light) { body { background: #f0ebe1; color: #0b1429; } .muted { color: #5b6478 !important; } }
      main { max-width: 420px; text-align: center; }
      svg { width: 44px; height: 72px; margin-bottom: 28px; }
      h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 6px; line-height: 1.6; }
      .muted { color: #8a97b8; font-size: 14px; }
      hr { border: 0; border-top: 1px solid rgba(138, 151, 184, 0.3); margin: 24px 0; }
      button {
        margin-top: 20px; padding: 10px 18px; border: 0; cursor: pointer; font: inherit;
        background: #2e6f9e; color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 60 100" aria-hidden="true">
        <rect x="0" y="0" width="20" height="20" fill="#7fb0d6" /><rect x="40" y="0" width="20" height="20" fill="#c9a227" />
        <rect x="20" y="20" width="20" height="20" fill="#7fb0d6" />
        <rect x="0" y="40" width="20" height="20" fill="#7fb0d6" /><rect x="40" y="40" width="20" height="20" fill="#7fb0d6" />
        <rect x="20" y="60" width="20" height="20" fill="#7fb0d6" />
        <rect x="0" y="80" width="20" height="20" fill="#7fb0d6" /><rect x="40" y="80" width="20" height="20" fill="#7fb0d6" />
      </svg>
      <h1>You are offline</h1>
      <p class="muted">Hosbah needs a connection to reach your servers. It will work again as soon as you are back online.</p>
      <hr />
      <div dir="rtl" lang="ar">
        <h1>أنت غير متصل</h1>
        <p class="muted">تحتاج حوسبة إلى اتصال للوصول إلى خوادمك. ستعمل مجددًا فور عودة الاتصال.</p>
      </div>
      <button type="button" onclick="location.reload()">Try again · حاول مجددًا</button>
    </main>
  </body>
</html>
